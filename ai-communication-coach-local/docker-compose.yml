version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_coach_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ai_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_coach_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin:password123@db:5432/ai_coach
      - SECRET_KEY=your-super-secret-key-keep-safe-in-prod-change-this
      - OLLAMA_URL=http://host.docker.internal:11434
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    volumes:
      - ./backend/static:/app/static
    networks:
      - ai_coach_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_coach_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - ai_coach_network

volumes:
  pgdata:

networks:
  ai_coach_network:
    driver: bridge

