services:
  # Backend Service (FastAPI)
  - type: web
    name: ai-coach-backend
    runtime: python
    region: ohio
    plan: free
    rootDir: ai-communication-coach/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_local.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_CLIENT_ID
        value: "YOUR_GOOGLE_CLIENT_ID"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./ai_coach.db"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ai-coach-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend Service (Next.js)
  - type: web
    name: ai-coach-frontend
    runtime: node
    region: ohio
    plan: free
    rootDir: ai-communication-coach/frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: "YOUR_GOOGLE_CLIENT_ID"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: ai-coach-backend
          envVarKey: RENDER_EXTERNAL_URL
