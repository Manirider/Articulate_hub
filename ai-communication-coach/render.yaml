services:
  # PostgreSQL Database
  - type: pserv
    name: ai-coach-postgres
    runtime: docker
    region: ohio
    plan: free
    dockerfilePath: ./database/Dockerfile.postgres
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: aicoach

  # Redis Cache
  - type: redis
    name: ai-coach-redis
    region: ohio
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Backend Service (FastAPI)
  - type: web
    name: ai-coach-backend
    runtime: python
    region: ohio
    plan: free
    rootDir: ai-communication-coach/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_local.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-coach-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-coach-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: ai-coach-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SENTRY_DSN
        value: "YOUR_SENTRY_DSN"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: ""

  # Celery Worker (Background AI Processing)
  - type: worker
    name: ai-coach-worker
    runtime: python
    region: ohio
    plan: free
    rootDir: ai-communication-coach/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.core.celery_config worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-coach-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-coach-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: ai-coach-backend
          property: env.JWT_SECRET

  # Celery Beat (Scheduled Tasks)
  - type: worker
    name: ai-coach-beat
    runtime: python
    region: ohio
    plan: free
    rootDir: ai-communication-coach/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.core.celery_config beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-coach-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-coach-redis
          property: connectionString

  # Frontend Service (Next.js)
  - type: web
    name: ai-coach-frontend
    runtime: node
    region: ohio
    plan: free
    rootDir: ai-communication-coach/frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: "YOUR_GOOGLE_CLIENT_ID"
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: ai-coach-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: "YOUR_SENTRY_DSN"
