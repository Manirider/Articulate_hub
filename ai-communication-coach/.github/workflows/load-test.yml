name: Load Testing

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  workflow_dispatch:      # Manual trigger
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        env:
          API_URL: ${{ github.event.inputs.environment == 'production' && 'https://ai-coach-backend.onrender.com' || 'https://ai-coach-backend-staging.onrender.com' }}
        run: |
          k6 run --summary-export=load-test-summary.json tests/k6/load_test.js

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-summary.json

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('load-test-summary.json', 'utf8'));
            
            const body = `## 🚀 Load Test Results
            
            | Metric | Value |
            |--------|-------|
| Requests/sec | ${summary.metrics.http_reqs.rate} |
            | Avg Response Time | ${summary.metrics.http_req_duration.avg}ms |
            | p95 Response Time | ${summary.metrics.http_req_duration['p(95)']}ms |
            | Error Rate | ${summary.metrics.http_req_failed.rate * 100}% |
            
            **Status:** ${summary.metrics.http_req_failed.rate < 0.01 ? '✅ PASSED' : '❌ FAILED'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
